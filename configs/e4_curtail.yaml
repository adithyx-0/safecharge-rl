# E4: PPO-Lagrangian trained and evaluated in the curtail-at-declared-departure environment (no power after the reported departure), truthful training reports.
agent:
  bc:
    epochs: 200
    expert: LLF
  clip: 0.2
  critic_warmup: 30
  dual_clip:
  - -1
  - 1
  dual_lr: 0.05
  ent_coef: 0.001
  epochs: 10
  gae_lambda: 0.97
  gamma: 0.999
  hid: 64
  j_ema: 0.7
  lam_max: 10.0
  lr: 0.0003
  lr_final: 0.1
  minibatch: 256
  n_envs: 48
  pool: mean
  scheme: uniform
  target_kl: 0.02
  train_reports:
  - mode: M0
  use_count: true
  curtail: true
base: configs/base.yaml
derived: configs/derived_caltech_kappa0.2.yaml
name: e4_curtail
train:
  eval_every: 20
  n_updates: 1500
